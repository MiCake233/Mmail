name: desktop-release

on:
  workflow_dispatch:

# macOS is deliberately not part of this matrix: its packages are published on
# a best-effort basis and may lag behind the other platforms. To build one, add
# an entry (os: macos-latest, args: '--mac --x64 --arm64') and run the workflow.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
          - os: ubuntu-latest
            name: linux
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Static checks
        run: npm run check

      - name: Package
        run: npx electron-builder --publish never ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: mmail-${{ matrix.name }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
