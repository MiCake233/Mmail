name: desktop-release

on:
  workflow_dispatch:

# Only Windows is built here. macOS and Linux targets remain in the
# electron-builder configuration and are built on demand: add a matrix entry such as
#   os: macos-latest, name: macos, args: '--mac --x64 --arm64'
#   os: ubuntu-latest, name: linux, args: ''
# and run the workflow.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Static checks
        run: npm run check

      - name: Package
        run: npx electron-builder --publish never ${{ matrix.args }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v4
        with:
          name: mmail-${{ matrix.name }}
          path: |
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
